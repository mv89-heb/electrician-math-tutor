name: Tests

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Report dependency security audit
        shell: bash
        run: |
          npm audit --no-package-lock --json > npm-audit.json || true
          node <<'NODE'
          const audit = require('./npm-audit.json');
          const counts = audit.metadata?.vulnerabilities ?? {};
          console.log('Dependency audit summary:', JSON.stringify(counts));
          for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
            console.log(`${item.severity.toUpperCase()}: ${name}; direct=${item.isDirect}; fixAvailable=${JSON.stringify(item.fixAvailable)}`);
          }
          NODE
      - name: Run learning and exercise tests
        run: npm test
      - name: Verify production build
        run: npm run build
